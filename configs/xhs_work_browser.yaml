# TreeCut XHS Work Browser V0.1.1 — 默认配置模板（不含任何敏感信息）。
# 运行时实际生效文件：{data_root}/config/xhs_work_browser.yaml（首次运行自动生成）。
# 安全纪律：本文件只含 origin 级静态 URL，无 query / signed / 凭证。
workspace_id: B007
# 空 → {data_root}/browser_profiles（稳定持久路径，不随 batch/temp 清理）
profile_root: ""
# TreeCut Local Service（§17 localhost HTTP / health）
treecut_local_url: "http://127.0.0.1:28888"
treecut_health_timeout_seconds: 3.0
# Browser Runtime（§2）：现有 Edge persistent context，无需下载 Chromium
browser_channel: "msedge"
headless: false
# 3 Fixed Functional Tabs（§13/14）：Creator / Spotlight / Frontend + 1 临时弹窗
expected_tab_count: 3
allow_temporary_popup: 1
# 统一 Bounded Retry（§22）
retry_max_attempts: 3
retry_delay_seconds: 2.0
# 导航目标：仅 origin，无 query
creator_home_url: "https://creator.xiaohongshu.com/"
spotlight_home_url: "https://ad.xiaohongshu.com/"
frontend_home_url: "https://www.xiaohongshu.com/"
# Session 判定 marker（§11/23：三站分别判定；expired 为强信号，避免已登录误报）
session_markers:
  creator:
    login:
      - "扫码登录"
      - "登录后查看"
      - "请登录"
      - "登录小红书"
    valid:
      - "发布笔记"
      - "创作中心"
      - "笔记管理"
      - "数据中心"
      - "首页"
    expired:
      - "登录已过期"
      - "请重新登录"
      - "登录状态已失效"
      - "session expired"
  spotlight:
    login:
      - "扫码登录"
      - "请登录"
    valid:
      - "推广"
      - "广告管理"
      - "创建广告"
      - "数据概览"
    expired:
      - "登录已过期"
      - "请重新登录"
      - "登录状态已失效"
      - "session expired"
  frontend:
    login:
      - "扫码登录"
      - "登录小红书"
    valid:
      - "首页"
      - "发现"
      - "关注"
      - "我的"
    expired:
      - "登录已过期"
      - "请重新登录"
      - "登录状态已失效"
      - "session expired"
