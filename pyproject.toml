[project]
name = "treecut"
version = "13.5.10"
description = "Portable AI-assisted video production for Windows"
requires-python = ">=3.11,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
treecut = "treecut.main:main"
treecut-desktop = "treecut.desktop:main"
treecut-api = "treecut.api:main"
treecut-xhs-browser = "treecut.browser.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 需要真实浏览器（Edge headless）的集成测试",
]
