<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"/>
<title>A2.1 目标身份绑定（抽屉实例）</title>
<style>
 body{font-family:'Microsoft YaHei',sans-serif;margin:0;background:#f5f6f8;color:#222}
 header{padding:10px 18px;background:#1f2937;color:#fff}
 h1{font-size:16px;margin:0 0 4px} .note{font-size:13px;color:#ddd}
 .wrap{padding:14px}
 .case{border:1px solid #ccc;border-radius:10px;background:#fff;padding:12px;margin:12px 0}
 .case h2{font-size:15px;margin:4px 0}
 .row{display:inline-block;border:1px solid #ddd;border-radius:8px;margin:6px;padding:6px;background:#fff;vertical-align:top;text-align:center}
 .row img{width:200px;display:block;border:1px solid #eee}
 .row select{margin:4px 0;width:170px}
 .saved{color:#0a7a0a;font-size:12px}
 .okmsg{position:fixed;bottom:16px;right:16px;background:#333;color:#fff;padding:8px 14px;border-radius:6px;display:none}
</style></head>
<body>
<header><h1>A2.1 目标身份绑定 — 只绑定"动作/追踪的目标抽屉"（同标签多框）</h1>
<div class="note">每帧若有多个抽屉框，请选<b>正在被拉出/要追踪的那个抽屉</b>对应框号；没有目标动作的帧选"无目标(跳过)"。
  109：请让"追踪抽屉"在 帧0→帧4 是<b>同一个物理抽屉</b>（前段它在动、后段它静止打开），这样机器才能看出"动作 vs 状态"。</div></header>
<div class="wrap" id="root"></div>
<div class="okmsg" id="ok"></div>
<script>
const $=s=>document.querySelector(s);
let MAN, ROI, SAVED={};
const LABEL_CN={"DRAWER":"抽屉","UPPER_THIN_DRAWER":"上层薄抽","TABLETOP":"桌板/台面","EXTENSION_TABLETOP":"伸缩桌板","SOCKET_MODULE":"插座模块","TRACK_SOCKET":"轨道插座","PERSON":"人","HAND":"手","ISLAND_BODY":"岛台主体","OTHER_MOVING_PART":"其他运动部件"};
async function jget(u){const r=await fetch(u);return r.json();}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function init(){
  MAN=await jget('/api/manifest'); ROI=await jget('/api/rois');
  SAVED=await jget('/api/a21/binding');
  const root=$('#root');root.innerHTML='';
  for(const mid of [52,109]){
    const c=MAN.cases.find(x=>x.media_id===mid);
    const card=document.createElement('div');card.className='case';
    card.innerHTML=`<h2>测试视频 ${mid} · ${c.frames.length} 张</h2><div class="rows"></div>`;
    const rows=card.querySelector('.rows');
    c.frames.forEach(f=>{
      const anns=ROI.annotations.filter(a=>a.media_id===mid&&a.frame_timestamp===f.t_s);
      const drawers=anns.filter(a=>a.object_name==='DRAWER'||a.object_name==='UPPER_THIN_DRAWER');
      const row=document.createElement('div');row.className='row';
      let opts='<option value="">无目标(跳过)</option>';
      drawers.forEach((a,i)=>{opts+=`<option value="${i}">框#${i+1} ${LABEL_CN[a.object_name]||a.object_name} [${a.bbox_pixel}]</option>`;});
      const cur=(SAVED.bindings||[]).find(b=>b.media_id===mid&&b.t_s===f.t_s);
      row.innerHTML=`<img src="/a21/frames/${esc(f.frame)}?v=${String(f.sha256||'').slice(0,8)}"/>
        <div style="font-size:12px">${f.frame.replace('.jpg','')} @ ${f.t_s}s · 抽屉框 ${drawers.length} 个</div>
        <select data-mid="${mid}" data-t="${f.t_s}" data-frame="${esc(f.frame)}">${opts}</select>
        <div class="saved"></div>`;
      row.querySelector('select').value=cur?(cur.chosen_index==null?'':String(cur.chosen_index)):'';
      row.querySelector('select').onchange=()=>save(row);
      rows.appendChild(row);
    });
    root.appendChild(card);
  }
}
async function save(row){
  const sel=row.querySelector('select');
  const val=sel.value===''?null:parseInt(sel.value,10);
  const r=await fetch('/api/a21/binding',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({media_id:parseInt(sel.dataset.mid,10),t_s:parseFloat(sel.dataset.t),chosen_index:val})});
  const j=await r.json();
  const m=$('#ok');m.textContent=j.ok?'已保存绑定':'失败：'+(j.error||'');m.style.display='block';setTimeout(()=>m.style.display='none',1800);
  if(j.ok){row.querySelector('.saved').textContent='已保存 ✓';}
}
init();
</script></body></html>
