<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"/>
<title>TreeCut A1 人工对象框标注</title>
<style>
 body{font-family:'Microsoft YaHei',sans-serif;margin:0;background:#f5f6f8;color:#222}
 header{padding:10px 18px;background:#1f2937;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
 header h1{font-size:16px;margin:0}
 .wrap{display:flex;height:calc(100vh - 52px)}
 .left{width:320px;border-right:1px solid #ddd;background:#fff;overflow:auto;padding:10px}
 .right{flex:1;overflow:auto;padding:12px;text-align:center}
 .case{border:1px solid #ddd;border-radius:8px;margin-bottom:10px;padding:8px;cursor:pointer}
 .case.active{border-color:#1a73e8;background:#eef4ff}
 .case .mid{font-weight:bold}.case .st{font-size:12px;color:#555}
 .frameTab{display:inline-block;padding:6px 12px;margin:2px;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#fff}
 .frameTab.active{background:#1a73e8;color:#fff}
 .frameTab.done{background:#cde7cd}
 canvas{border:1px solid #888;max-width:100%;background:#111;cursor:crosshair}
 .boxlist{text-align:left;font-size:12px;max-height:220px;overflow:auto}
 .tools{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
 button{padding:4px 10px;border-radius:6px;border:1px solid #999;cursor:pointer;background:#fff}
 button.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
 button.warn{background:#b26a00;color:#fff;border-color:#b26a00}
 .modeStatus{font-weight:bold}
 .curLabel{color:#1a73e8;font-weight:bold}
 .facts{background:#fff8e1;border:1px solid #f0d070;padding:8px;border-radius:6px;font-size:12px;text-align:left;margin:8px 0;white-space:pre-wrap}
 .msg{position:fixed;bottom:18px;right:18px;background:#333;color:#fff;padding:8px 14px;border-radius:6px;display:none;z-index:9}
 .hint{font-size:12px;color:#777;margin:4px 0}
</style></head>
<body>
<header><h1>TreeCut A1 · 人工对象框标注</h1>
  <span style="font-size:12px">仅 6 个测试视频 · 30 张图片 · 只保存人工框</span>
  <span id="stat" style="font-size:12px"></span></header>
<div class="wrap">
 <div class="left" id="cases"></div>
 <div class="right">
   <div id="frameTabs"></div>
   <div class="tools">
     <label>当前要框：<select id="labelSel"></select></label>
     <button id="btnMode" class="primary">开始框选</button>
     <button id="btnDel">删除选中</button>
     <button id="btnClear">清空当前图片</button>
     <button id="btnSave" class="primary">保存当前图片</button>
     <span class="modeStatus" id="modeStatus">框选模式：已关闭</span>
   </div>
   <div class="hint" id="curHint">提示：开启「框选模式」后，在画面上【按住鼠标并拖动】即可画出矩形；松手完成一个框。可连续画多个框（换标签后直接再画）。点已有框可选中并拖动；太小的框会被丢弃。</div>
   <canvas id="cv"></canvas>
   <div class="facts" id="facts"></div>
   <div class="boxlist" id="boxlist"></div>
 </div>
</div>
<div class="msg" id="msg"></div>
<script>
// ============ 显示层中文映射（内部值不变，仅界面显示中文） ============
const LABELS=["TABLETOP","EXTENSION_TABLETOP","DRAWER","UPPER_THIN_DRAWER","TRACK_SOCKET","SOCKET_MODULE","PERSON","HAND","ISLAND_BODY","OTHER_MOVING_PART"];
const LABEL_CN={"TABLETOP":"桌板/台面","EXTENSION_TABLETOP":"伸缩桌板","DRAWER":"抽屉","UPPER_THIN_DRAWER":"上层薄抽","TRACK_SOCKET":"轨道插座","SOCKET_MODULE":"插座模块","PERSON":"人","HAND":"手","ISLAND_BODY":"岛台主体","OTHER_MOVING_PART":"其他运动部件"};
const VAL_CN={"EXTEND":"拉出/伸出","RETRACT":"收回","DRAWER_OPEN":"抽屉打开","DRAWER_CLOSE":"抽屉关闭","SOCKET_INSERT":"插入插座","SOCKET_REMOVE":"拔出插座","SOCKET_ADJUST":"调整插座","STATIC":"静止","OUTWARD":"向外","YES":"是","NO":"否","NOT_PROVEN":"未证实","NONE":"无","STATIC_PRODUCT_PRESENTATION":"静态产品讲解","DRAWER_OPEN_STATE":"抽屉已打开(状态)","SOCKET_ADJUST_NOT_EXTEND":"调整插座≠拉出"};
const FACT_CN={"requested_action":"要验证的动作","actual_action":"实际发生的动作","actual":"实际发生的动作","direction":"运动方向","object_state":"对象状态","state":"对象状态","person_motion":"人的运动","tabletop_action":"桌板动作","semantic_family":"语义类别","requested":"要验证的动作"};
function labCN(v){return LABEL_CN[v]||v;}
function valCN(v){return VAL_CN[v]||String(v);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function optsHTML(sel){return LABELS.map(l=>`<option value="${l}" ${l===sel?'selected':''}>${labCN(l)}</option>`).join('');}
function factsHTML(facts){
  if(!facts||!Object.keys(facts).length) return '';
  return Object.entries(facts).map(([k,v])=>`${FACT_CN[k]||k}：${valCN(v)}`).join('\n');
}
// ============================================================
let MAN=null, ROI=null, cur={mid:null,frame:null};
let boxes=[], selBox=-1;
// 框选交互状态（按架构师规格拆分，不再用一个 drawing 混淆）
let drawMode=false;      // 框选模式是否开启（开启后可连续画多框）
let drawingNew=false;    // 正在拖画新框
let drawStart=null;      // 按下起点
let drag=false, dragStart=null; // 拖动已有框
const MIN_BOX=8;         // 最小边长(px)，小于视为误点
const $=s=>document.querySelector(s);
const img=new Image();
const cv=$('#cv'), ctx=cv.getContext('2d');
async function jget(u){const r=await fetch(u);return r.json();}
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500);}
function setMode(on){
  drawMode=on;
  const b=$('#btnMode');
  if(on){b.textContent='结束框选';b.className='warn';$('#modeStatus').textContent='框选模式：已开启（可连续画多个框）';}
  else{b.textContent='开始框选';b.className='primary';$('#modeStatus').textContent='框选模式：已关闭';}
  if(!on){drawingNew=false;drawStart=null;}
  redraw();
}
function updateCurLabel(){const v=$('#labelSel').value;document.getElementById('curHint').innerHTML=`提示：当前要框：<span class="curLabel">${labCN(v)}</span> —— 开启框选模式后，在画面上【按住鼠标并拖动】画出矩形；松手完成。可连续画多个框。`;
}
async function init(){
  $('#labelSel').innerHTML=optsHTML('TABLETOP');
  $('#labelSel').onchange=updateCurLabel;
  updateCurLabel();
  MAN=await jget('/api/manifest');
  ROI=await jget('/api/rois');
  drawCases(); pick(MAN.cases[0], MAN.cases[0].frames[0]);
  refreshStat();
}
function drawCases(){
  const el=$('#cases');el.innerHTML='';
  MAN.cases.forEach(c=>{
    const d=document.createElement('div');d.className='case';
    d.innerHTML=`<div class="mid">测试视频 ${c.media_id} · 要验证：${valCN(c.requested)}</div>
      <div class="st">${esc(c.desc||'')}<br/>窗口 [${c.frozen_window_s[0]} , ${c.frozen_window_s[1]}] 秒 · 共 ${c.frames.length} 张</div>`;
    d.onclick=()=>{document.querySelectorAll('.case').forEach(x=>x.classList.remove('active'));d.classList.add('active');pick(c,c.frames[0]);};
    el.appendChild(d);
  });
}
function refreshStat(){
  const done=MAN.cases.filter(c=>c.frames.every(f=>ROI.annotations.some(a=>a.media_id===c.media_id&&a.frame_timestamp===f.t_s)));
  $('#stat').textContent=`已完成案例 ${done.length}/${MAN.cases.length}`;
}
function pick(c,f){
  cur={mid:c.media_id,frame:f};
  $('#facts').innerHTML='<b>已知人工结论</b>\n'+factsHTML(c.human_facts||{});
  loadFrame();
}
async function loadFrame(){
  const c=MAN.cases.find(x=>x.media_id===cur.mid);
  if(!c){return;}
  $('#frameTabs').innerHTML='';
  c.frames.forEach((f,i)=>{
    const b=document.createElement('span');b.className='frameTab';
    const n=ROI.annotations.filter(a=>a.media_id===cur.mid&&a.frame_timestamp===f.t_s).length;
    b.textContent=`第${i+1}张 @ ${f.t_s}s${n?`（${n}框）`:''}`;
    if(n)b.classList.add('done');
    if(cur.frame&&f.t_s===cur.frame.t_s)b.classList.add('active');
    b.onclick=()=>{cur.frame=f;loadFrame();};
    $('#frameTabs').appendChild(b);
  });
  const f=(c.frames.find(x=>x.t_s===cur.frame.t_s))||c.frames[0];cur.frame=f;
  if(f.error){msg('该帧提取失败: '+f.frame);return;}
  img.onload=()=>{cv.width=img.naturalWidth;cv.height=img.naturalHeight;redraw();};
  img.onerror=()=>{console.error('FRAME_LOAD_FAILED',f.frame);msg('图片加载失败：'+f.frame);};
  img.src='/frames/'+encodeURIComponent(f.frame)+'?v='+encodeURIComponent(String(f.sha256||'').slice(0,12));
  boxes=ROI.annotations.filter(a=>a.media_id===cur.mid&&a.frame_timestamp===f.t_s).map(a=>({...a,px:a.bbox_pixel.slice()}));
  selBox=-1;drawBoxList();
}
function redraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(img.naturalWidth)ctx.drawImage(img,0,0);
  boxes.forEach((b,i)=>{
    const [x1,y1,x2,y2]=b.px;
    const w=x2-x1,h=y2-y1;
    if(w<1&&h<1)return;
    ctx.strokeStyle=i===selBox?'#ff3b30':'#1a73e8';ctx.lineWidth=i===selBox?3:2;
    ctx.strokeRect(x1,y1,w,h);
    ctx.fillStyle='rgba(26,115,232,.15)';ctx.fillRect(x1,y1,w,h);
    ctx.font='16px "Microsoft YaHei",sans-serif';ctx.fillStyle=ctx.strokeStyle;
    ctx.fillText(labCN(b.object_name),x1+3,Math.max(18,y1-6));
  });
}
function evPos(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*cv.width/r.width,y:(ev.clientY-r.top)*cv.height/r.height};}
function hitBox(p){return boxes.map((b,i)=>({i,b})).reverse().find(({b})=>p.x>=b.px[0]&&p.x<=b.px[2]&&p.y>=b.px[1]&&p.y<=b.px[3]);}
cv.addEventListener('mousedown',ev=>{
  const p=evPos(ev);
  const hit=hitBox(p);
  if(hit){ // 点中已有框：只选中/拖动，不新建（即使框选模式开启）
    selBox=hit.i;drag=true;dragStart={x:p.x-hit.b.px[0],y:p.y-hit.b.px[1]};
    drawingNew=false;drawStart=null;
    redraw();drawBoxList();return;
  }
  if(drawMode){ // 框选模式：开始拖画新框
    drawingNew=true;drawStart=p;
    boxes.push({px:[p.x,p.y,p.x,p.y],object_name:$('#labelSel').value});
    selBox=boxes.length-1;
    redraw();
  }
});
cv.addEventListener('mousemove',ev=>{
  const p=evPos(ev);
  if(drawingNew&&selBox>=0){ // 实时拉大矩形
    const b=boxes[selBox];
    b.px[2]=Math.max(0,Math.min(cv.width,p.x));
    b.px[3]=Math.max(0,Math.min(cv.height,p.y));
    redraw();return;
  }
  if(drag&&selBox>=0){ // 拖动已有框
    const b=boxes[selBox];const w=b.px[2]-b.px[0],h=b.px[3]-b.px[1];
    let x=p.x-dragStart.x,y=p.y-dragStart.y;
    x=Math.max(0,Math.min(cv.width-w,x));y=Math.max(0,Math.min(cv.height-h,y));
    b.px=[x,y,x+w,y+h];redraw();
  }
});
cv.addEventListener('mouseup',()=>{
  if(drawingNew&&selBox>=0){ // 松手完成框：归一化 + 最小尺寸校验
    const b=boxes[selBox];
    const x1=Math.min(b.px[0],b.px[2]),y1=Math.min(b.px[1],b.px[3]);
    const x2=Math.max(b.px[0],b.px[2]),y2=Math.max(b.px[1],b.px[3]);
    if(x2-x1<MIN_BOX||y2-y1<MIN_BOX){
      boxes.splice(selBox,1);selBox=-1;
      msg('框太小，请按住鼠标拖出矩形');
    } else {
      b.px=[x1,y1,x2,y2];
      msg(`已画 1 个框（${labCN(b.object_name)}），可直接换标签继续画下一个`);
      drawBoxList();
    }
    drawingNew=false;drawStart=null;
    // drawMode 保持不变：可继续画下一个框
    redraw();
  }
  drag=false;
});
$('#btnMode').onclick=()=>setMode(!drawMode);
$('#btnDel').onclick=()=>{if(selBox>=0){boxes.splice(selBox,1);selBox=-1;redraw();drawBoxList();}};
$('#btnClear').onclick=()=>{boxes=[];selBox=-1;redraw();drawBoxList();};
$('#btnSave').onclick=async()=>{
  const f=cur.frame;
  const payload={media_id:cur.mid,frame_timestamp:f.t_s,rois:boxes.map(b=>({object_name:b.object_name,bbox_pixel:b.px}))};
  const r=await fetch('/api/rois/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json();
  if(j.ok){ROI=await jget('/api/rois');msg(`已保存 ${j.saved} 个框`);refreshStat();drawBoxList();}
  else msg('保存失败：'+j.error);
};
function drawBoxList(){
  const el=$('#boxlist');el.innerHTML=`<b>本张图片的框（共 ${boxes.length} 个）：</b>`;
  if(!boxes.length){el.innerHTML+=' 还没有框（开启框选模式后按住鼠标拖出矩形）';redraw();return;}
  boxes.forEach((b,i)=>{
    const d=document.createElement('span');d.style.cssText='display:inline-block;margin:2px 8px 2px 0;border:1px solid #ccc;padding:2px 6px;border-radius:6px;';
    const sel=document.createElement('select');sel.innerHTML=optsHTML(b.object_name);
    sel.onchange=()=>{b.object_name=sel.value;redraw();};
    const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{boxes.splice(i,1);drawBoxList();};
    const lab=document.createElement('span');lab.textContent=`#${i+1} ${labCN(b.object_name)} [${Math.round(b.px[0])},${Math.round(b.px[1])},${Math.round(b.px[2])},${Math.round(b.px[3])}]`;
    d.appendChild(sel);d.appendChild(del);d.appendChild(lab);
    el.appendChild(d);
  });
  redraw();
}
init();
</script></body></html>
